plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ns4.quiz'
    compileSdk 34

    defaultConfig {
        applicationId "com.ns4.quiz"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.gms:play-services-ads:23.5.0'
}