<!-- AFICHAJ IMEDYA: mete XP, Pyès ak pousantaj yo TOUSWIT, san tann Firebase/questions.js chaje.
     (Li kouri pandan paj la ap li, anvan script ki telechaje yo.) -->
<script>
(function () {
  try {
    var g = function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
    var f = function (n) { n = +n || 0; return n >= 1e6 ? (n / 1e6).toFixed(1).replace(".0", "") + "M" : n >= 1e4 ? (n / 1e3).toFixed(1).replace(".0", "") + "k" : String(n); };

    // XP + Pyès (verite sèvè a + pwen ki sove offline men poko voye)
    var u = g("ns4_user") || {}, xp = +u.xp || 0, co = +u.coins || 0, ids = u.rewardIds || {};
    (g("ns4_outbox_" + u.uid) || []).forEach(function (it) {
      if (!ids[it.id]) { xp += +it.xp || 0; co += +it.coins || 0; }
    });
    var x = document.getElementById("tb-xp"), c = document.getElementById("tb-coins");
    if (x) x.textContent = f(xp);
    if (c) c.textContent = f(co);

    // Pousantaj sou bouton matyè yo (ranplase "75%" default la)
    var p = (u.uid && g("ns4_progress_" + u.uid)) || g("ns4_progress") || {};
    var counts = g("ns4_level_counts") || {};
    var btns = document.querySelectorAll(".subjectBtn");
    for (var i = 0; i < btns.length; i++) {
      var s = btns[i].getAttribute("data-subject"), box = btns[i].querySelector(".subjectPercent");
      if (!box) continue;
      var lv = p[s] || {}, passed = 0;
      for (var k in lv) { if (lv[k] && lv[k].examPassed) passed++; }
      var pc = Math.min(100, Math.round(passed / (counts[s] || 10) * 100));
      box.textContent = pc + "%";
      box.style.background = pc < 40 ? "#e74c3c" : pc < 80 ? "#f39c12" : "#2ecc71";
    }
  } catch (e) {}
})();
</script>
